<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motokraf · Demo</title><style>html,body{margin:0;background:#e7eee9}#loading{padding:24px;color:#075d35;font-family:system-ui,sans-serif;text-align:center}</style></head><body><div id="loading">Membuka demo Motokraf…</div><script>
function runPatch(){
  const logo='motokraf-site-ico.webp';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const reportRows=()=>{const month='September 2026',inc=income(),exp=out(),margin=inc-exp;return {month,inc,exp,margin,closed:closed().length,active:active().length,rows:jobs.map(j=>[j.date,j.id,j.motor,j.work,j.status,j.payment||0,j.price])}};
  const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  window.downloadExcel=()=>{const r=reportRows();const lines=[['LAPORAN BULANAN MOTOKRAF',r.month],[],['Ringkasan','Nilai'],['Pemasukan',r.inc],['Pengeluaran',r.exp],['Margin',r.margin],['Job CLOSED',r.closed],['Job Aktif',r.active],[],['Tanggal','Job ID','Motor','Pekerjaan','Status','Payment','Harga Deal'],...r.rows];const xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Laporan"><Table>'+lines.map(row=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="String">'+esc(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download='laporan-motokraf-'+r.month.toLowerCase().replace(' ','-')+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
  const pdfEsc=s=>String(s).replace(/([\\()])/g,'\\$1').replace(/[^\x20-\x7e]/g,' ');
  window.downloadPDF=()=>{const r=reportRows(),lines=['LAPORAN BULANAN MOTOKRAF','Periode: '+r.month,'','PEMASUKAN           '+F(r.inc),'PENGELUARAN         '+F(r.exp),'MARGIN              '+F(r.margin),'JOB CLOSED          '+r.closed,'JOB AKTIF           '+r.active,'','TRANSAKSI'];r.rows.forEach(x=>lines.push(x[0]+' | '+x[1]+' | '+x[2]+' | '+x[4]+' | '+F(x[5])));let content='BT /F1 10 Tf 50 790 Td 14 TL ';lines.forEach((line,i)=>{if(i)content+='T* ';content+='('+pdfEsc(line)+') Tj ';});content+='ET';const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream'];let pdf='%PDF-1.4\n',offs=[0];objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});const xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));a.download='laporan-motokraf-'+r.month.toLowerCase().replace(' ','-')+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
  window.editHistoryJob=id=>{const j=jobs.find(x=>x.id===id);if(!j)return;document.getElementById('modal').innerHTML='<div class="modal-card"><div class="modal-head"><h2>Edit riwayat Job</h2><button class="close" onclick="closeModal()">×</button></div><div class="help">Khusus Owner. Payment tersimpan tetap menjadi sumber pemasukan.</div><div class="field"><label>Model motor</label><input id="editMotor" value="'+esc(j.motor)+'"></div><div class="field" style="margin-top:10px"><label>Pekerjaan</label><input id="editWork" value="'+esc(j.work)+'"></div><div class="field" style="margin-top:10px"><label>Harga deal (Rp)</label><input id="editPrice" type="number" value="'+j.price+'"></div><div class="field" style="margin-top:10px"><label>Nama pelanggan</label><input id="editCustomer" value="'+esc(j.customer||'')+'"></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveHistoryJob(\''+id+'\')">SIMPAN PERUBAHAN</button></div>';document.getElementById('modal').classList.add('open')};
  window.saveHistoryJob=id=>{const j=jobs.find(x=>x.id===id);j.motor=document.getElementById('editMotor').value.trim();j.work=document.getElementById('editWork').value.trim();j.price=Number(document.getElementById('editPrice').value);j.customer=document.getElementById('editCustomer').value.trim();save();closeModal();render();toast('Riwayat Job berhasil diperbarui.')};
  function reportPage(){const r=reportRows();return '<section class="card form-card"><p class="eyebrow">LAPORAN OWNER</p><h2>Laporan Bulanan</h2><div class="help">Ringkasan dihitung dari Payment dan Pengeluaran pada data demo. Job aktif tidak dihitung sebagai pemasukan.</div><div class="period"><div><small>Periode laporan</small><strong>'+r.month+'</strong></div><button class="refresh" onclick="renderReport()">Refresh</button></div><div class="metrics" style="margin-top:14px"><div class="metric"><div class="ico">💵</div><small>Pemasukan</small><b>'+F(r.inc)+'</b></div><div class="metric"><div class="ico">🪙</div><small>Margin</small><b>'+F(r.margin)+'</b></div><div class="metric"><div class="ico">💵</div><small>Pengeluaran</small><b>'+F(r.exp)+'</b></div><div class="metric"><div class="ico">🔧</div><small>Job CLOSED</small><b>'+r.closed+'</b></div></div><div class="wide green"><div class="ico">🪙</div><div><small>Catatan</small><strong>'+r.active+' Job masih aktif tidak masuk pemasukan.</strong></div></div><div class="download-grid"><button class="primary" onclick="downloadPDF()">↓ Download PDF</button><button class="secondary" onclick="downloadExcel()">↓ Download Excel</button></div></section>'}
  window.renderReport=()=>{document.getElementById('root').innerHTML='<main class="app">'+appTop('LAPORAN','Ringkasan bulanan')+'<div class="content">'+reportPage()+'</div>'+bottomReport()+'</main>';enhance()};
  function bottomReport(){return '<nav class="bottom"><button onclick="go(\'home\')"><span>⌂</span>Ringkasan</button><button onclick="go(\'jobs\')"><span>▣</span>Job</button><button class="active"><span>▤</span>Laporan</button><button onclick="go(\'expense\')"><span>♧</span>Belanja</button><button onclick="logout()"><span>↪</span>Keluar</button></nav>'}
  const oldRender=window.render;window.render=function(){if(state.page==='report'&&state.role==='OWNER'){renderReport();return}oldRender();enhance()};
function enhance(){if(!state.role)return;document.querySelectorAll('.metric .ico').forEach((el,i)=>{el.textContent=["🔧","💵","💵","🔧"][i]});document.querySelectorAll('.wide .ico').forEach((el,i)=>{el.textContent=i===2?'🪙':'💵'});document.querySelectorAll('.job-right .action').forEach(b=>{if(state.role==='OWNER')b.textContent='Periksa pekerjaan'});document.querySelectorAll('.bottom button').forEach(b=>{if(b.textContent.includes('Belanja')){const s=b.querySelector('span');if(s)s.textContent='🛒'}});document.querySelectorAll('.drawer nav button').forEach(b=>{if(b.textContent.includes('Pengeluaran')){const s=b.querySelector('span');if(s)s.textContent='🛒'}});const logoImg='<img src="'+logo+'" alt="Motokraf" style="width:70px;height:70px;object-fit:contain">';const l=document.querySelector('.login-logo');if(l)l.innerHTML=logoImg;const m=document.querySelector('.mark');if(m)m.innerHTML='<img src="'+logo+'" alt="Motokraf" style="width:42px;height:42px;object-fit:contain">';if(state.role==='OWNER'&&state.page==='history'){document.querySelectorAll('.job').forEach((row,i)=>{if(row.querySelector('.edit-history'))return;const list=closed();const j=list[i];if(!j)return;const b=document.createElement('button');b.className='secondary edit-history';b.textContent='Edit';b.style.minHeight='34px';b.style.padding='6px 9px';b.onclick=()=>editHistoryJob(j.id);row.querySelector('.job-right').appendChild(b)})}if(state.role==='OWNER'){const nav=document.querySelector('.drawer nav');if(nav&&!nav.querySelector('.report-link')){const b=document.createElement('button');b.className='report-link';b.innerHTML='<span>▤</span>Laporan Bulanan';b.onclick=()=>{closeDrawer();go('report')};nav.appendChild(b)}}}
  const originalNewJob=window.newJob,originalJobsPage=window.jobsPage;
function operatorNewJob(){return '<section class="card form-card"><button class="back" onclick="go(\'jobs\')">← Kembali ke Job aktif</button><p class="eyebrow">PEKERJAAN BARU</p><h2>Mulai pekerjaan</h2><div class="help">Isi jenis pekerjaan dan detail singkatnya. Harga deal membantu saat nanti pekerjaan selesai dan dibayar.</div><form class="form" onsubmit="addJob(event)"><div class="field"><label>Model motor *</label><input id="motor" list="models" required placeholder="Contoh: Honda Beat"><small>Pilih model yang sudah ada atau ketik model baru.</small><datalist id="models">'+models.map(x=>'<option>'+x+'</option>').join('')+'</datalist></div><div class="field"><label>Jenis pekerjaan *</label><input id="jobwork" required placeholder="Contoh: Ganti kulit jok / Tambah busa / Custom jok"><small>Contoh: ganti kulit jok, tambah busa, custom jok, perbaikan busa.</small></div><div class="field"><label>Harga deal (Rp) *</label><input id="price" required type="number" min="0" inputmode="numeric" placeholder="Contoh: 250000"><small>Masukkan angka Rupiah tanpa titik.</small></div><div class="field"><label>Nama pelanggan</label><input id="customer" placeholder="Contoh: Budi"></div><div class="field"><label>WhatsApp pelanggan</label><input id="wa" inputmode="tel" placeholder="Contoh: 081234567890"></div><div class="field"><label>Deskripsi pekerjaan</label><textarea id="notes" placeholder="Contoh: ganti kulit hitam, tambah busa bagian belakang"></textarea></div><button class="primary" type="submit">MULAI KERJA</button></form></section>'}
function operatorJobsPage(){return '<section class="card"><div class="section-title"><div><p class="eyebrow">OPERASIONAL</p><h2>Job Aktif</h2></div><button class="action" onclick="go(\'new\')">＋ Tambah Job</button></div><div class="help">Pilih “Detail kerja” untuk melihat pekerjaan yang harus diselesaikan dan mencatat Payment saat selesai.</div>'+rows(active()).replaceAll('Buka Job','Detail kerja')+'</section>'}
window.newJob=function(){return state.role==='OPERATOR'?operatorNewJob():originalNewJob()};window.jobsPage=function(){return state.role==='OPERATOR'?operatorJobsPage():originalJobsPage()};
const style=document.createElement('style');style.textContent='.download-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.download-grid button{width:100%;font-size:11px}.login-logo img{display:block;margin:auto}.mark img{display:block;margin:auto}@media(max-width:380px){.download-grid{grid-template-columns:1fr}}';document.head.appendChild(style);enhance();
}
try{['motoPins','motoJobs','motoExpenses','motoModels'].forEach(function(k){var v=localStorage.getItem(k);if(v)JSON.parse(v)})}catch(e){['motoPins','motoJobs','motoExpenses','motoModels'].forEach(function(k){localStorage.removeItem(k)})}
fetch('demo-local-basil-app.html').then(r=>r.text()).then(h=>{h=h.replace('<head>','<head><style>.login-wrap{width:100%!important;max-width:360px;min-width:0}.login-card{width:100%;min-width:0}.login-screen{overflow-x:hidden;padding-left:12px;padding-right:12px}.login-logo{background:url(motokraf-site-ico.webp) center/contain no-repeat;color:transparent;font-size:0}.seg.income{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;line-height:1.1}</style>').replace('function top(','function appTop(').replace('${top(','${appTop(').replace('<div class="login-logo">M</div><h1>','<h1>').replace('<div style="font-size:28px;color:var(--g)">◎</div><h2>','<div class="login-logo"><img src="motokraf-site-ico.webp" alt="Motokraf" style="width:58px;height:58px;object-fit:contain"></div><h2>').replace('function enhance(){if(!state.role)return;','function enhance(){');const code='<scr'+'ipt>'+ '('+runPatch.toString()+')();'+'<'+'/script>';h=h.replace('</body>',code+'</body>');document.open();document.write(h);document.close()}).catch(()=>document.getElementById('loading').textContent='Demo belum dapat dibuka. Muat ulang halaman ini.');
</script></body></html>
