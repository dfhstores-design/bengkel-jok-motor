e;position:fixed;inset:0;background:#10211755;z-index:30}.drawer-backdrop.open{display:block}.drawer{width:min(400px,88vw);height:100%;background:#fff;padding:22px 18px}.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px}.drawer-head h2{margin:0;font-size:20px}.close{width:42px;height:42px;border:0;background:#eef4f0;border-radius:12px;font-size:22px;font-weight:900}.drawer nav{margin-top:8px}.drawer nav button{width:100%;height:58px;border:0;border-bottom:1px solid #eef1ee;background:#fff;text-align:left;padding:0 14px;color:#24362b;font-weight:900;font-size:15px}.drawer nav button span{display:inline-grid;width:28px;color:var(--g2);font-size:18px}.form-card{border-top:3px solid var(--g2)}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--g);font-weight:900;margin:0 0 6px}.form-card h2{margin:0;font-size:21px}.help,.expense-info{padding:11px 12px;border-radius:10px;background:#e9f8ee;color:#1e6f46;font-size:12px;line-height:1.45;margin:12px 0}.form{display:grid;gap:13px;margin-top:16px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd9d0;border-radius:9px;background:#fff;color:var(--ink);padding:11px 12px;min-height:46px;outline:0}.field textarea{min-height:75px}.field small{font-size:10px;color:var(--muted);line-height:1.35}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #d8f0df}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0 3px}.choice{border:1px solid var(--line);border-radius:9px;background:#fff;color:#284033;text-align:left;min-height:45px;padding:9px;font-size:11px;font-weight:900}.choice.selected{background:var(--g);border-color:var(--g);color:#fff}.form .primary{width:100%}.empty{padding:18px 5px;color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 0 15px}.tab{background:#fff;border:0;border-bottom:2px solid transparent;color:#68756d;min-height:44px;font-size:11px;font-weight:900}.tab.active{color:var(--g);border-color:var(--g2)}.expense-row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid #edf1ee}.expense-row b{font-size:13px}.expense-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.back{border:0;background:transparent;color:var(--g);padding:0 0 13px;font-weight:900;font-size:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.detail-cell{background:#f7faf8;border:1px solid var(--line);border-radius:9px;padding:10px}.detail-cell small{display:block;color:var(--muted);font-size:10px}.detail-cell b{display:block;margin-top:4px;font-size:13px}.media-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.media-box{height:74px;border:1px dashed #abcab4;border-radius:9px;background:#f6fbf7;color:var(--g);display:grid;place-items:center;text-align:center;font-size:10px;font-weight:900}.login-screen{min-height:100dvh;display:grid;place-items:center;padding:18px;background:#fafcfb}.login-wrap{width:min(100%,390px);text-align:center}.login-logo{width:86px;height:86px;margin:auto;border:4px solid var(--g);border-radius:50%;display:grid;place-items:center;color:var(--g);font-size:37px;font-weight:900}.login-wrap h1{font-size:27px;letter-spacing:-.03em;color:var(--g);margin:17px 0 2px}.login-wrap>p{font-size:13px;color:var(--muted);margin:0 0 22px}.login-card{background:#f0faf4;border:1px solid #d6eadc;border-radius:15px;padding:20px;box-shadow:0 7px 20px #1937260f}.login-card h2{font-size:18px;margin:8px 0 3px}.login-card p{font-size:12px;color:var(--muted);margin:0 0 14px}.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.role-pick button{min-height:42px;border:1px solid #cfe1d4;background:#fff;border-radius:9px;color:var(--g);font-weight:900}.role-pick button.selected{background:var(--g);color:#fff}.pin-display{height:51px;background:#fff;border:1px solid #d3e0d7;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:13px;font-size:22px;margin-bottom:13px}.pin-display i{width:8px;height:8px;border-radius:50%;background:#7b8790}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.keypad button{height:42px;border:1px solid #d6e2da;border-radius:9px;background:#fff;font-weight:900}.login-submit{width:100%;margin-top:13px}.secret{display:flex;gap:8px;text-align:left;align-items:start;background:#f0faf4;border:1px solid #dceae0;border-radius:10px;padding:11px;margin-top:18px;font-size:10px;color:var(--muted)}.secret b{color:var(--g);font-size:16px}.notice{padding:11px 12px;background:#fff8dd;border:1px solid #eedba1;border-radius:10px;color:#76530b;font-size:12px;margin-bottom:12px}.modal{position:fixed;inset:0;background:#10211755;z-index:40;display:none;align-items:end;justify-content:center}.modal.open{display:flex}.modal-card{width:min(520px,100%);background:#fff;border-radius:18px 18px 0 0;padding:19px;max-height:88dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:18px}@media(max-width:380px){.content{padding-left:13px;padding-right:13px}.top{padding-left:13px;padding-right:13px}.metric{min-height:112px}.metric b{font-size:16px}.chart{gap:4px}.seg{font-size:7px}.bottom button{font-size:9px}}

<body><div id="root"></div><div id="drawerLayer" class="drawer-backdrop" onclick="closeDrawer(event)"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-head"><h2>Menu Owner</h2><button class="close" onclick="closeDrawer()">×</button></div><nav><button onclick="go('home');closeDrawer()"><span>⌂</span>Ringkasan</button><button onclick="go('jobs');closeDrawer()"><span>▣</span>Job Aktif</button><button onclick="go('expense');closeDrawer()"><span>♧</span>Pengeluaran</button><button onclick="go('history');closeDrawer()"><span>▤</span>Riwayat Job</button><button onclick="go('settings');closeDrawer()"><span>⚙</span>Pengaturan PIN</button></nav></aside></div><div id="modal" class="modal"></div>
<script>
const F=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),D='11 Sep 2026';let state={role:sessionStorage.getItem('motoRole')||'',page:sessionStorage.getItem('motoRole')==='OPERATOR'?'jobs':'home',pin:'',loginRole:'OWNER',toast:'',detail:null,expenseTab:'new',period:'7 hari'};let pins=JSON.parse(localStorage.getItem('motoPins')||'{"OWNER":"1234","OPERATOR":"1234"}');let jobs=JSON.parse(localStorage.getItem('motoJobs')||'null')||[{id:'JOB-001',motor:'Honda Beat',work:'Ganti kulit jok',price:250000,customer:'Budi',status:'IN_PROGRESS',date:D},{id:'JOB-002',motor:'Yamaha NMAX',work:'Modifikasi busa',price:350000,customer:'Rina',status:'CLOSED',date:'10 Sep 2026',payment:350000},{id:'JOB-003',motor:'Honda Vario',work:'Jasa pasang kulit',price:120000,customer:'',status:'CLOSED',date:'09 Sep 2026',payment:120000}];let expenses=JSON.parse(localStorage.getItem('motoExpenses')||'null')||[{item:'Belanja busa',amount:200000,date:D,cat:'MATERIAL'}];let models=JSON.parse(localStorage.getItem('motoModels')||'null')||['Honda Beat','Yamaha NMAX','Honda Vario','Honda Scoopy'],materials=['Belanja busa','Belanja kulit','Bensin','Lem jok'];const active=()=>jobs.filter(x=>x.status==='IN_PROGRESS'),closed=()=>jobs.filter(x=>x.status==='CLOSED'),income=()=>closed().reduce((a,x)=>a+(Number(x.payment)||0),0),out=()=>expenses.reduce((a,x)=>a+(Number(x.amount)||0),0);function save(){localStorage.setItem('motoJobs',JSON.stringify(jobs));localStorage.setItem('motoExpenses',JSON.stringify(expenses));localStorage.setItem('motoModels',JSON.stringify(models))}function go(p){state.page=p;state.detail=null;state.toast='';render()}function toast(s){state.toast=s;render();setTimeout(()=>{if(state.toast===s){state.toast='';render()}},2500)}function openDrawer(){document.getElementById('drawerLayer').classList.add('open')}function closeDrawer(){document.getElementById('drawerLayer').classList.remove('open')}
function top(title,sub){return `<header class="top"><div class="top-left"><button class="hamb" onclick="${state.role==='OWNER'?'openDrawer()':'go(\'jobs\')'}">☰</button><div><div class="brand">${title}</div><div class="sub">${sub}</div></div></div><div class="profile"><span class="avatar">${state.role==='OWNER'?'O':'P'}</span><span>${state.role==='OWNER'?'Owner Motokraf':'Operator'}</span></div></header>`}function bottom(){let a=state.role==='OWNER'?[['home','⌂','Ringkasan'],['jobs','▣','Job'],['expense','♧','Belanja'],['history','▤','Riwayat'],['logout','↪','Keluar']]:[['jobs','▣','Job Aktif'],['new','＋','Tambah Job'],['logout','↪','Keluar']];return `<nav class="bottom">${a.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="${x[0]==='logout'?'logout()':`go('${x[0]}')`}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function chart(){let ds=[['05',0,0],['06',0,0],['07',0,0],['08',0,0],['09',120000,1],['10',350000,1],['11',income(),active().length?0:1]];return `<div class="chart">${ds.map(d=>`<div class="bar"><div class="stack"><div class="seg income" style="height:${Math.max(d[1]?25:22,Math.min(84,d[1]/4500))}px">${d[1]?F(d[1]).replace('Rp ','Rp '):'Rp 0'}</div><div class="seg jobs" style="height:${Math.max(22,d[2]*25)}px">${d[2]} Job</div></div><small>${d[0]}/09</small></div>`).join('')}</div><div class="legend"><span><i style="background:var(--g)"></i>Pemasukan (Rp)</span><span><i style="background:#ecad46"></i>Job selesai</span></div>`}function rows(xs){return xs.length?xs.map(x=>`<article class="job"><div><h3>${x.motor}</h3><p>${x.work}</p><small>${x.customer||'Tanpa nama pelanggan'} · ${x.date}</small></div><div class="job-right"><strong>${F(x.price)}</strong>${x.status==='IN_PROGRESS'?`<button class="action" onclick="openDetail('${x.id}')">Buka Job</button>`:`<span class="status">CLOSED</span>`}</div></article>`).join(''):'<div class="empty">Belum ada data. Tambahkan transaksi pertama untuk mulai mencatat pekerjaan.</div>'}
function home(){return `<section class="card welcome"><div><h2>Selamat datang, Owner!</h2><p>Pantau pekerjaan dan uang masuk hari ini.</p></div><div class="mark">M</div></section><section class="card period"><div><small>Periode laporan</small><strong><select onchange="state.period=this.value;render()"><option>7 hari</option><option>30 hari</option><option>90 hari</option></select></strong></div><div class="period-date"><b>11 Sep 2026</b>Data aktual dari aplikasi</div></section><div class="section-title"><h2>RINGKASAN HARI INI</h2><button class="refresh" onclick="toast('Data sudah diperbarui dari demo lokal.')">Refresh</button></div><div class="metrics"><div class="metric"><div class="ico">↗</div><small>Job aktif</small><b>${active().length}</b></div><div class="metric"><div class="ico">Rp</div><small>Pemasukan hari ini</small><b>${F(income())}</b></div><div class="metric"><div class="ico">♧</div><small>Pengeluaran bulan ini</small><b>${F(out())}</b></div><div class="metric"><div class="ico">✓</div><small>Job selesai</small><b>${closed().length}</b></div></div><div class="wide"><div class="ico">♧</div><div><small>Total pengeluaran</small><strong>${F(out())}</strong></div></div><div class="wide rose"><div class="ico">Rp</div><div><small>Perlu diperiksa</small><strong>${active().length} Job belum ditutup</strong></div></div><div class="wide green"><div class="ico">↗</div><div><small>Pemasukan - pengeluaran</small><strong>${F(income()-out())}</strong></div></div><section class="card"><div class="chart-head"><div><h2>Penjualan 7 hari terakhir</h2><small>Pemasukan dan jumlah Job selesai</small></div><button class="refresh" onclick="toast('Grafik memakai data Payment dan Job.')">Detail</button></div>${chart()}</section><section class="card"><div class="section-title"><h2>PEKERJAAN AKTIF</h2><button onclick="go('jobs')">Lihat semua</button></div>${rows(active())}</section>`}
function choices(){return ['Ganti kulit jok','Perbaikan busa','Modifikasi busa','Custom jok','Lainnya'].map(x=>`<button type="button" class="choice ${state.work===x?'selected':''}" onclick="state.work='${x}';render()">${x}</button>`).join('')}function newJob(){return `<section class="card form-card"><button class="back" onclick="go('jobs')">← Kembali ke Job aktif</button><p class="eyebrow">PEKERJAAN BARU</p><h2>Catat Job</h2><div class="help">Pilih jenis pekerjaan agar pencatatan lebih cepat. Harga deal diisi sesuai kesepakatan dengan pelanggan.</div><label class="label">Jenis pekerjaan</label><div class="choices">${choices()}</div><form class="form" onsubmit="addJob(event)"><div class="field"><label>Model motor *</label><input id="motor" list="models" required placeholder="Contoh: Honda Beat"><small>Pilih daftar atau ketik model baru. Model baru akan muncul lagi nanti.</small><datalist id="models">${models.map(x=>`<option>${x}</option>`).join('')}</datalist></div><div class="field"><label>Deskripsi pekerjaan *</label><input id="jobwork" value="${state.work||''}" required placeholder="Contoh: Ganti kulit jok warna hitam"></div><div class="field"><label>Harga deal (Rp) *</label><input id="price" required type="number" min="0" inputmode="numeric" placeholder="Contoh: 250000"><small>Masukkan angka Rupiah tanpa titik.</small></div><div class="field"><label>Nama pelanggan</label><input id="customer" placeholder="Contoh: Budi"></div><div class="field"><label>WhatsApp pelanggan</label><input id="wa" inputmode="tel" placeholder="Contoh: 081234567890"></div><div class="field"><label>Catatan</label><textarea id="notes" placeholder="Contoh: selesai Jumat sore"></textarea></div><button class="primary" type="submit">SIMPAN JOB</button></form></section>`}function jobsPage(){return `<section class="card"><div class="section-title"><div><p class="eyebrow">OPERASIONAL</p><h2>Job Aktif</h2></div><button class="action" onclick="go('new')">＋ Tambah Job</button></div><div class="help">Selesaikan pekerjaan, tambahkan media bila perlu, lalu catat pembayaran untuk menutup transaksi.</div>${rows(active())}</section>`}function history(){return `<section class="card"><div class="section-title"><div><p class="eyebrow">RIWAYAT TRANSAKSI</p><h2>Job CLOSED</h2></div><span class="status">${closed().length} Job</span></div>${rows(closed())}</section>`}
function expense(){return `<section class="card form-card"><p class="eyebrow">PENGELUARAN</p><h2>Belanja & operasional</h2><div class="tabs"><button class="tab ${state.expenseTab==='new'?'active':''}" onclick="state.expenseTab='new';render()">CATAT BARU</button><button class="tab ${state.expenseTab==='history'?'active':''}" onclick="state.expenseTab='history';render()">RIWAYAT BELANJA</button></div>${state.expenseTab==='new'?expenseForm():expenses.map(x=>`<div class="expense-row"><span><b>${x.item}</b><small>${x.date} · ${x.cat}${x.supplier?' · '+x.supplier:''}</small></span><b>${F(x.amount)}</b></div>`).join('')||'<div class="empty">Belum ada pengeluaran.</div>'}</section>`}function expenseForm(){return `<div class="expense-info">Pilih bahan yang pernah dicatat atau ketik item baru. Tanggal mengikuti tanggal nota jika pencatatan terlambat.</div><form class="form" onsubmit="addExpense(event)"><div class="field"><label>Tanggal nota *</label><input id="exdate" type="date" value="2026-09-11" required></div><div class="field"><label>Nama bahan / keperluan *</label><input id="item" list="items" required placeholder="Pilih atau ketik bahan"><datalist id="items">${['Belanja busa','Belanja kulit','Bensin','Lem jok'].map(x=>`<option>${x}</option>`).join('')}</datalist></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><div class="field"><label>Jumlah / Qty</label><input id="qty" placeholder="Contoh: 2"></div><div class="field"><label>Satuan</label><input id="unit" placeholder="lembar / pcs"></div></div><div class="field"><label>Total biaya (Rp) *</label><input id="amount" type="number" min="0" inputmode="numeric" required placeholder="Contoh: 85000"></div><div class="field"><label>Kategori</label><select id="cat"><option>MATERIAL</option><option>OPERATIONAL</option><option>TOOL</option><option>OTHER</option></select></div><div class="field"><label>Tempat beli (opsional)</label><input id="supplier" placeholder="Contoh: Toko Sumber Jaya"></div><div class="field"><label>Catatan (opsional)</label><textarea id="notes" placeholder="Contoh: harga promo / nota terlambat"></textarea></div><button class="primary" type="submit">SIMPAN PENGELUARAN</button></form>`}
function detail(){let x=jobs.find(j=>j.id===state.detail);return `<section class="card"><button class="back" onclick="go('jobs')">← Kembali</button><p class="eyebrow">JOB DETAIL</p><h2>${x.motor}</h2><p style="color:var(--muted);font-size:13px">${x.work}</p><div class="detail-grid"><div class="detail-cell"><small>Status</small><b>${x.status}</b></div><div class="detail-cell"><small>Harga deal</small><b>${F(x.price)}</b></div><div class="detail-cell"><small>Pelanggan</small><b>${x.customer||'—'}</b></div><div class="detail-cell"><small>Tanggal</small><b>${x.date}</b></div></div><h3 style="font-size:14px;margin:17px 0 8px">Dokumentasi pekerjaan</h3><div class="media-list"><button class="media-box" onclick="toast('Demo: pilih foto Before')">＋<br>Before</button><button class="media-box" onclick="toast('Demo: pilih foto Process')">＋<br>Process</button><button class="media-box" onclick="toast('Demo: pilih foto After')">＋<br>After</button></div>${x.status==='IN_PROGRESS'?`<button class="primary" style="width:100%;margin-top:15px" onclick="openPayment('${x.id}')">Catat Payment & Close Job</button>`:'<div class="help" style="margin-top:15px">Job ini sudah CLOSED. Tidak ada edit status atau pembayaran ulang.</div>'}</section>`}
function login(){let dots=Array.from({length:4},(_,i)=>`<i style="${i<state.pin.length?'background:var(--g)':''}"></i>`).join('');return `<main class="login-screen"><div class="login-wrap"><div class="login-logo">M</div><h1>MOTOKRAF</h1><p>Operasional Bengkel Jok Motor</p><section class="login-card"><div style="font-size:28px;color:var(--g)">◎</div><h2>Masuk ke Sistem</h2><p>Pilih peran dan masukkan PIN</p><div class="role-pick"><button class="${state.loginRole==='OWNER'?'selected':''}" onclick="state.loginRole='OWNER';state.pin='';render()">OWNER</button><button class="${state.loginRole==='OPERATOR'?'selected':''}" onclick="state.loginRole='OPERATOR';state.pin='';render()">OPERATOR</button></div><div class="pin-display">${dots}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div><button class="primary login-submit" onclick="submitLogin()">↪ MASUK</button></section><div class="secret"><b>◆</b><span><strong>PIN bersifat rahasia</strong><br>Jangan bagikan PIN kepada pihak lain.</span></div></div></main>`}function key(k){if(k==='C')state.pin='';else if(k==='⌫')state.pin=state.pin.slice(0,-1);else if(state.pin.length<4)state.pin+=k;render()}function submitLogin(){if(state.pin!==pins[state.loginRole]){state.pin='';toast('PIN belum benar. Demo menggunakan PIN 1234.');return}state.role=state.loginRole;state.page=state.role==='OWNER'?'home':'jobs';sessionStorage.setItem('motoRole',state.role);render()}function logout(){sessionStorage.removeItem('motoRole');state.role='';state.page='home';render()}function openDetail(id){state.detail=id;render()}
function openPayment(id){let x=jobs.find(j=>j.id===id);document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Catat pembayaran</h2><button class="close" onclick="closeModal()">×</button></div><div class="help">Pembayaran harus sama dengan harga deal agar Job bisa ditutup.</div><div class="field"><label>Total pembayaran (Rp)</label><input id="payAmount" type="number" value="${x.price}" inputmode="numeric"></div><div class="field" style="margin-top:12px"><label>Metode pembayaran</label><select id="payMethod"><option>CASH</option><option>TRANSFER</option><option>QRIS</option><option>OTHER</option></select></div><button class="primary" style="width:100%;margin-top:14px" onclick="pay('${id}')">SIMPAN PAYMENT & CLOSE</button></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function pay(id){let x=jobs.find(j=>j.id===id),a=Number(document.getElementById('payAmount').value);if(a!==x.price){toast('Nominal harus sama dengan harga deal.');return}x.payment=a;x.status='CLOSED';save();closeModal();state.detail=null;go('jobs');toast('Payment tersimpan. Job berhasil CLOSED.')}
function addJob(e){e.preventDefault();let m=document.getElementById('motor').value.trim();let w=document.getElementById('jobwork').value.trim();let p=Number(document.getElementById('price').value);if(!models.includes(m))models.push(m);jobs.unshift({id:'JOB-'+String(jobs.length+1).padStart(3,'0'),motor:m,work:w,price:p,customer:document.getElementById('customer').value.trim(),status:'IN_PROGRESS',date:D});save();state.work='';go('jobs');toast('Job baru berhasil disimpan.')}function addExpense(e){e.preventDefault();let item=document.getElementById('item').value.trim();if(!materials.includes(item))materials.push(item);expenses.unshift({item,amount:Number(document.getElementById('amount').value),date:document.getElementById('exdate').value,cat:document.getElementById('cat').value,qty:document.getElementById('qty').value,unit:document.getElementById('unit').value,supplier:document.getElementById('supplier').value,notes:document.getElementById('notes').value});save();state.expenseTab='history';render();toast('Pengeluaran berhasil disimpan sesuai tanggal nota.')}
function page(){if(!state.role)return login();let b=state.detail?detail():state.page==='home'?home():state.page==='jobs'?jobsPage():state.page==='new'?newJob():state.page==='expense'?expense():state.page==='history'?history():`<section class="card"><p class="eyebrow">PENGATURAN</p><h2>PIN aplikasi</h2><div class="help">Mode Owner dan Operator mengatur tampilan kerja. Ini demo lokal, bukan autentikasi enterprise.</div></section>`;return `<main class="app">${top(state.role==='OWNER'?'OWNER':'OPERATOR',state.role==='OWNER'?'Ringkasan operasional':'Jalankan pekerjaan hari ini')}<div class="content">${state.toast?`<div class="notice">${state.toast}</div>`:''}${b}</div>${bottom()}</main>`}function render(){document.getElementById('root').innerHTML=page()}render();
</script></body></html>
